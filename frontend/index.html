<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoList - Đăng nhập</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --error-bg: #fef2f2;
      --error-text: #b91c1c;
      --success-bg: #f0fdf4;
      --success-text: #15803d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0f172a 70%);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--primary);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 20px;
    }

    h1 {
      font-size: 22px;
      margin: 0;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      font-size: 15px;
      color: var(--text);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 4px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .message {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .message.error { display: block; background: var(--error-bg); color: var(--error-text); }
    .message.success { display: block; background: var(--success-bg); color: var(--success-text); }

    .hint {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">✓</div>
      <h1>TodoList</h1>
    </div>
    <p class="subtitle">Đăng nhập để quản lý công việc của bạn</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="Nhập username" required>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="Nhập mật khẩu" required>
      </div>

      <button id="login-btn" type="submit">Đăng nhập</button>
    </form>

    <div id="message" class="message" role="alert</h1>"></div>
    <p class="hint">Chưa có tài khoản? Liên hệ quản trị viên để được cấp.</p>
  </main>

  <script>
    // Backend REST API (xem backend/index.js)
    const API_BASE = 'http://localhost:3000';

    const form = document.getElementById('login-form');
    const button = document.getElementById('login-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault()

      const username = form.username.value.trim();
      const password = form.password.value;

      if(!username || !password){
        console.error('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.')
        return;
      }

      button.disabled = true
      button.textContent = "Đang đăng nhập..."

      xhrLogin(username, password);
    })

    async function fetchLogin(username, password){
      try{
        const res = await fetch(API_BASE + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json"},
          body: JSON.stringify({username, password})
        })

        const data = await res.json().catch(()=>({}))

        if(!res.ok){
          console.error("Đăng nhập thất bại!")
          return;
        }

        localStorage.setItem("accessToken", data.accessToken)
        console.log("Đăng nhập thành công!", data.accessToken)
      }
      catch{
        console.error("Không kết nối được tới server. Kiểm tra backend đang chạy.")
      }
      finally{
        button.disabled = false;
        button.textContent = "Đăng nhập"
      }
    }

    async function xhrLogin(username, password){
      try{
        const {ok, data} = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest()
          xhr.open("POST", API_BASE + "/login")
          xhr.setRequestHeader("Content-Type", "application/json")

          xhr.onload = () => {
            let body = {}
            try {
              body = JSON.parse(xhr.responseText)
            }catch{}

            resolve({ok: xhr.status === 200, data: body})
          }

          xhr.onerror = () => reject(new Error("Network error"))

          xhr.send(JSON.stringify({username, password}))
        })

        if(!ok){
          console.error("Đăng nhập thất bại!")
          return;
        }

        localStorage.setItem("accessToken", data.accessToken)
        console.log("Đăng nhập thành công!", data.accessToken)
      }
      catch{
        console.error("Không kết nối được tới server. Kiểm tra backend đang chạy.")
      }
      finally{
        button.disabled = false;
        button.textContent = "Đăng nhập"
      }
    }
  </script>
</body>
</html>
