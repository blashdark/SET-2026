<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Gọi một ly trà sữa</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 24px;
    }

    button {
      padding: 8px 16px;
      margin: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    /* Class được soạn sẵn theo đề: nền đổi màu, viền đậm */
    .selected {
      background-color: #ffe0b2;
      border: 2px solid #e65100;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h3>Chọn Size:</h3>
  <button id="small" class="size selected">S</button>
  <button id="medium" class="size">M</button>
  <button id="large" class="size">L</button>

  <h3>Chọn Topping:</h3>
  <button class="topping">Trân châu</button>
  <button class="topping">Thạch</button>
  <button class="topping">Pudding</button>
  <button class="topping">Kem cheese</button>

  <script src="./js/topping.js"></script>
</body>
</html>
