<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Định dạng văn bản</title>
</head>
<body>
    <div class="text-formatting">
        <div class="text-formatting__header">
            <h1 class="text-formatting__title">Định dạng văn bản</h1>
        </div>
        <div class="text-formatting__body">
            <div class="text-formatting__item">
                <span class="text-formatting__item-title">Hóa học:</span>
                <span class="text-formatting__item-content"> Nước: </span><span class="text-formatting__item-content--red">H<sub>2</sub>O</span><span class="text-formatting__item-content">; Axit Sunfuric: </span><span class="text-formatting__item-content--red">H<sub>2</sub>SO<sub>4</sub></span>
            </div>
            <div class="text-formatting__item">
                <span class="text-formatting__item-title">Toán học:</span>
                <span class="text-formatting__item-content"> Phương trình bậc 2: </span><span class="text-formatting__item-content--red">ax<sup>2</sup> + bx + c = 0</span>
            </div>
            <div class="text-formatting__item">
                <span class="text-formatting__item-title">Tin học:</span>
                <span class="text-formatting__item-content"> Vòng lặp for:</span>
            </div>
            <div class="text-formatting__code">
                <p>int tong = 0;</p>
                <p>for (int i = 1; i &lt;= 10; i++)</p>
                <p>&emsp;&emsp;&emsp;&emsp;tong += i;</p>
                <p>printf("Tong cac so tu i => 10 la: %d\n", tong);</p>
            </div>
        </div>
    </div>
</body>
</html>
