<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Form đăng nhập</title>
</head>
<body>
    <main class="login">
        <div class="container">
            <h1 class="login__title">Form đăng nhập</h1>
            <form action="" class="login__form">
                <div class="login__form-field">
                    <label for="username" class="login__form-label">Tên người dùng</label>
                    <input id="username" type="text" class="login__form-input" value="Phước Thịnh">
                </div>
                <div class="login__form-field">
                    <label for="password" class="login__form-label">Mật khẩu</label>
                    <input id="password" type="password" class="login__form-input" value="12345">
                </div>
                <button class="login__form-button">Đăng nhập</button>
                <p class="login__form-welcome">Chào bạn <span class="login__form-welcome--bold login__form-welcome--italic">Phước Thịnh</span></p>
            </form>
        </div>
    </main>
</body>
</html>
